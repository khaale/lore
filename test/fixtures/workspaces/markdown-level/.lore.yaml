id: https://example.org/markdown-level
name: markdown-level
default_range: string
imports: [linkml:types]
classes:
  Thing:
    class_uri: markdown-level:Thing
    slots: [id, kind, title, summary]
slots:
  id:
    range: string
    identifier: true
  kind:
    range: string
    designates_type: true
  title:
    range: string
    required: true
  summary:
    range: string
    annotations:
      'lore:markdown_selectors': ['## Summary']
