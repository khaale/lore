openapi: 3.1.0
info: { title: Orders, version: '1.0' }
paths:
  /orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getOrder
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
    post:
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      responses:
        '204': { description: Saved }
components:
  schemas:
    Order:
      type: object
      required: [id]
      properties:
        id: { type: string }
        parent: { $ref: '#/components/schemas/Order' }
        detail: { $ref: '#/components/schemas/Order~1Detail' }
        $ref: { type: string }
      example: { $ref: 'ordinary example data, not a reference' }
    Order/Detail:
      allOf:
        - { $ref: '#/components/schemas/Order' }
        - { type: object, properties: { quantity: { type: integer } } }
